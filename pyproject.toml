[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elia-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "sentence-transformers>=3.3.0",
    "streamlit>=1.40.0",
    "typer>=0.13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=6.0.0"]

[project.scripts]
elia-eval = "cli.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
